version: "3.9"
name: ThinkCode

services:
  backend:
    build:
      context: ./backend
    container_name: app-backend
    restart: always
    expose:
      - "8000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: app-frontend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./frontend/.env

  nginx:
    image: nginx:alpine
    container_name: app-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
